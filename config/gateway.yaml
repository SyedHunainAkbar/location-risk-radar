# LLM Gateway routing. Each role maps to an ordered fallback chain of
# "provider:model" entries plus shared call parameters. The gateway tries entries
# in order and uses the first that succeeds. "mock" is always the terminal fallback
# so a keyless run still answers.

defaults:
  temperature: 0.2
  max_tokens: 1024
  timeout: 60

roles:
  quant_analyst:
    temperature: 0.0
    chain:
      - openai:gpt-4o-mini
      - nvidia:meta/llama-3.3-70b-instruct
      - mock

  voice_of_customer:
    temperature: 0.3
    chain:
      - nvidia:meta/llama-3.3-70b-instruct
      - openai:gpt-4o-mini
      - voyager:llama4-scout-17b
      - mock

  risk_auditor:
    temperature: 0.0
    chain:
      - nvidia:qwen/qwen2.5-72b-instruct
      - voyager:qwen3-235b-a22b-instruct-2507
      - openai:gpt-4o-mini
      - mock

  topic_labeler:
    temperature: 0.0
    max_tokens: 16
    chain:
      - openai:gpt-4o-mini
      - nvidia:meta/llama-3.3-70b-instruct
      - mock

  rag_answer:
    temperature: 0.0
    max_tokens: 512
    chain:
      - nvidia:meta/llama-3.3-70b-instruct
      - openai:gpt-4o-mini
      - voyager:llama4-scout-17b
      - mock

  rag_judge:
    temperature: 0.0
    max_tokens: 8
    chain:
      - nvidia:qwen/qwen2.5-7b-instruct
      - openai:gpt-4o-mini
      - voyager:qwen3-235b-a22b-instruct-2507
      - mock
