name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: lint + tests (coverage >= 80%)
    runs-on: ubuntu-latest
    env:
      # Tests use the deterministic mock provider only. No real keys in CI.
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CI installs the app runtime plus only the modeling/NLP libs the test
          # suite imports (not the BERTopic/UMAP/HDBSCAN/TensorFlow stack, which
          # the tests do not exercise). This keeps the run fast and deterministic.
          pip install -r requirements-ci.txt
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src app pipeline tests scripts

      - name: Ruff format check
        run: ruff format --check src app pipeline tests scripts

      - name: Pytest with coverage (fail under 80% for src/lrr)
        run: >-
          python -m pytest
          --cov=src/lrr --cov-report=term-missing --cov-report=xml
          --cov-fail-under=80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the scan covers every commit

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan git history for secrets
        run: gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1

      - name: Scan working tree for secrets
        run: gitleaks dir --config .gitleaks.toml --redact --verbose --exit-code 1
