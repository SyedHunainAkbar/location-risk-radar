# Clean editorial light theme for Location Risk Radar. One accent color.
[theme]
base = "light"
primaryColor = "#2166AC"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F8"
textColor = "#1A1A1A"
font = "sans serif"

[server]
headless = true
maxUploadSize = 5

[browser]
gatherUsageStats = false
